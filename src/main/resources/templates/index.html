<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de contactos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <h1>Listado de Contactos</h1>
    </div>

    <div class="row mb-3">
        <div class="col-lg-3">
            <a th:href="@{/nuevo}" class="btn btn-primary btn-sm">Agregar contacto</a>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Email</th>
            <th>Celular</th>
            <th>Etiqueta</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contacto : ${contactos}">
            <td th:text="${contacto.nombre}">Nombre</td>
            <td th:text="${contacto.apellido}">Apellido</td>
            <td th:text="${contacto.email}">Email</td>
            <td th:text="${contacto.celular}">Celular</td>
            <td th:text="${contacto.etiqueta != null ? contacto.etiqueta.nombreEtiqueta : 'Sin etiqueta'}">Etiqueta</td>
            <td>
                <a th:href="@{/modificar/{id}(id=${contacto.id})}" class="btn btn-info btn-sm">Modificar</a>
                <a href="javascript:void(0)" th:onclick="'eliminar(' + ${contacto.id} + ')'" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>


<hr>
<div class="container mt-4">
    <div class="row">
        <h1>Listado de Etiquetas</h1>
    </div>

    <div class="row mb-3">
        <div class="col-lg-3">
            <a th:href="@{/etiqueta/nueva}" class="btn btn-primary btn-sm">Agregar etiqueta</a>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="etiqueta : ${listaEtiquetas}">
            <td th:text="${etiqueta.nombreEtiqueta}"></td>
            <td>
                <a href="javascript:void(0)" th:onclick="'eliminarEtiqueta(' + ${etiqueta.id} + ')'" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>


<!-- SweetAlert & jQuery -->
<script src="https://code.jquery.com/jquery-3.4.1.js"></script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script> 
<script>
    function eliminar(id) {
        swal({
            title: "¿Está seguro de eliminar?",
            text: "Una vez eliminado, no se podrá recuperar.",
            icon: "warning",
            buttons: true,
            dangerMode: true,
        }).then((OK) => {
            if (OK) {
                $.ajax({
                    url: "/contacto/" + id,
                    success: function (res) {
                        console.log("Contacto eliminado:", res);
                        location.href = "/";
                    }
                });
            }
        });
    }
</script>

<script>
    function eliminarEtiqueta(id) {
        console.log(id);
        swal({
            title: "¿Está seguro de eliminar?",
            text: "Una vez eliminado, no se podrá recuperar.",
            icon: "warning",
            buttons: true,
            dangerMode: true,
        }).then((OK) => {
            if (OK) {
                $.ajax({
                    url: "/etiqueta/" + id,
                    success: function (res) {
                        console.log("Etiqueta eliminada:", res);
                        location.href = "/";
                    }
                });
            }
        });
    }
</script>

</body>
</html>
