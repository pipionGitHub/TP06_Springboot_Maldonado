<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Etiqueta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-6 col-md-8 mx-auto card p-4">
                <h1 class="text-center mb-4">Agregar etiqueta</h1>
                <form th:action="@{${etiqueta.id} != null ? '/actualizar/' + ${etiqueta.id} : '/etiqueta'}"
                    th:object="${etiqueta}" method="post">


                    <div class="form-group mb-3">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombreEtiqueta}" class="form-control" placeholder="Ingrese el nombre de la etiqueta" required>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
</body>

</html>
