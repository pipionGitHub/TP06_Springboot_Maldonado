<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-lg-6 col-md-8 mx-auto card p-4">
            <h1 class="text-center mb-4">Modificar Contacto</h1>
            <form th:action="@{${contacto.id} != null ? '/modificar/' + ${contacto.id} : '/contacto'}" th:object="${contacto}" method="post">

                <div class="form-group mb-3">
                    <label>ID</label>
                    <input type="text" th:field="*{id}" class="form-control" readonly>
                </div>

                <div class="form-group mb-3">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingrese su nombre" required>
                </div>

                <div class="form-group mb-3">
                    <label>Apellido</label>
                    <input type="text" th:field="*{apellido}" class="form-control" placeholder="Ingrese su apellido" required>
                </div>

                <div class="form-group mb-3">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="Ingrese su email">
                </div>

                <div class="form-group mb-3">
                    <label>Celular</label>
                    <input type="text" th:field="*{celular}" class="form-control" placeholder="Ingrese su número">
                </div>

                <div class="form-group mb-4">
                    <label>Etiqueta</label>
                    <select th:field="*{etiqueta}" class="form-select" required>
                        <option value="" disabled selected>Seleccione una etiqueta</option>
                        <th:block th:each="etiqueta : ${listaEtiquetas}">
                            <option th:value="${etiqueta.id}" th:text="${etiqueta.nombreEtiqueta}"></option>
                        </th:block>
                    </select>
                </div>


                <div class="text-center">
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
